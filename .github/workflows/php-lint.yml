name: PHP syntax

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check PHP syntax
        run: |
          find wp-content -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate OpenAPI YAML syntax
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python -c "import yaml; d=yaml.safe_load(open('docs/openapi/dealz-v1.openapi.yaml', encoding='utf-8')); assert d['openapi'] == '3.1.0'; assert '/trips/{trip_public_id}/budget' in d['paths']; print('OpenAPI YAML parsed successfully')"
