name: Import official local font artifact

on:
  push:
    branches: [ work/ui-rental-cta-browser-migration-2026-11-22 ]
    paths:
      - .github/workflows/import-local-fonts.yml

permissions:
  contents: write
  actions: read

jobs:
  import-fonts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/ui-rental-cta-browser-migration-2026-11-22
      - name: Download the already-fetched Google Fonts artifact
        uses: actions/download-artifact@v4
        with:
          name: dealz-official-local-fonts
          repository: ${{ github.repository }}
          run-id: 44956887983
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/dealz-fonts
      - name: Install licensed local assets and update progress
        run: |
          set -euo pipefail
          target="wp-content/themes/dealz-theme/assets/fonts"
          mkdir -p "$target"
          cp /tmp/dealz-fonts/*.woff2 /tmp/dealz-fonts/fonts.css /tmp/dealz-fonts/font-proof.json "$target/"
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/bricolagegrotesque/OFL.txt -o "$target/OFL-Bricolage-Grotesque.txt"
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/OFL.txt -o "$target/OFL-Be-Vietnam-Pro.txt"
          cat > docs/third-party.md <<'EOF'
          # Third-party assets

          ## Bricolage Grotesque
          - Source: official Google Fonts CSS API, fetched once in GitHub Actions run 44956887983.
          - Source URL: https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap
          - Weights: 700 and 800; WOFF2 subsets: latin, latin-ext, vietnamese.
          - License: SIL Open Font License 1.1; see wp-content/themes/dealz-theme/assets/fonts/OFL-Bricolage-Grotesque.txt.

          ## Be Vietnam Pro
          - Source: official Google Fonts CSS API, fetched once in GitHub Actions run 44956887983.
          - Weights: 400, 600 and 700; WOFF2 subsets: latin, latin-ext, vietnamese.
          - License: SIL Open Font License 1.1; see wp-content/themes/dealz-theme/assets/fonts/OFL-Be-Vietnam-Pro.txt.
          - FontTools inspection: downloaded WOFF2 subset files do not expose the OpenType tnum feature. Keep the requested font family; do not silently substitute another font. This is a known typography limitation pending owner decision.

          ## Size and runtime behavior
          - Total WOFF2 payload: 279,284 bytes (272.74 KiB), above the approximate 220 KiB target.
          - Generated fonts.css references only local files. The deployed theme must not request Google Fonts or any other external font origin.
          - font-proof.json records source, exact files, byte sizes and tnum inspection result.
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/PROGRESS.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'Contrast matrix + token gates are in CI. Official Google Fonts WOFF2 artifact run 44956887983 downloaded the requested subsets; fontTools found Be Vietnam Pro tnum=false and total WOFF2=279,284 bytes (272.74 KiB), above ~220 KiB target. Import locally and add browser proof next; no font substitution. Master Handoff source remains unavailable',
              'Official Google Fonts WOFF2 files + OFL licenses are now imported locally. FontTools proof: Be Vietnam Pro tnum=false; total WOFF2=279,284 bytes (272.74 KiB), above ~220 KiB target. Next: enqueue local CSS, preload two files, add Playwright document.fonts/glyph/network checks. No font substitution. Master Handoff source remains unavailable'
          )
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target" docs/third-party.md docs/PROGRESS.md
          git commit -m "feat: self-host official Google Fonts assets"
          git push origin HEAD:work/ui-rental-cta-browser-migration-2026-11-22
