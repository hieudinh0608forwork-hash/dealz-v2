name: Browser QA desktop and mobile

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Start clean WordPress and MySQL
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 180

      - name: Install WordPress CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp-cli.phar
          container_id="$(docker compose ps -q wordpress)"
          test -n "$container_id"
          docker cp /tmp/wp-cli.phar "$container_id:/tmp/wp-cli.phar"

      - name: Install WordPress and activate DealZ
        run: |
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root core install \
            --url=http://127.0.0.1:8080 \
            --title="DealZ Browser QA" \
            --admin_user=dealz-ci-admin \
            --admin_password=ci-only-password-not-for-reuse \
            --admin_email=dealz-ci@example.invalid \
            --skip-email
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root plugin activate dealz-core
          docker compose exec -T wordpress php /tmp/wp-cli.phar --allow-root theme activate dealz-theme

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --prefix tests/browser --no-audit --no-fund
          tests/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Run desktop and mobile browser scenarios
        run: |
          mkdir -p artifacts
          PLAYWRIGHT_JSON_OUTPUT_FILE=artifacts/playwright-results.json tests/browser/node_modules/.bin/playwright test tests/browser/itinerary.spec.cjs --reporter=line,json

      - name: Export readable Playwright error log
        if: always()
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          from pathlib import Path

          lines = ["DealZ Browser QA error report"]
          report_path = Path("artifacts/playwright-results.json")
          if report_path.exists():
              report = json.loads(report_path.read_text(encoding="utf-8"))
              def visit(suite):
                  for spec in suite.get("specs", []):
                      for test in spec.get("tests", []):
                          for result in test.get("results", []):
                              if result.get("status") not in ("passed", "skipped"):
                                  lines.append(f"\nFAILED: {spec.get('title', '(unnamed test)')}")
                                  for error in result.get("errors", []):
                                      lines.append(error.get("message", str(error)))
                                      if error.get("stack"):
                                          lines.append(error["stack"])
                  for child in suite.get("suites", []):
                      visit(child)
              for suite in report.get("suites", []):
                  visit(suite)
          for context_file in sorted(Path("test-results").rglob("error-context.md")):
              lines.append(f"\n--- {context_file} ---")
              lines.append(context_file.read_text(encoding="utf-8", errors="replace"))
          if len(lines) == 1:
              lines.append("No failed test error records.")
          Path("artifacts/playwright-errors.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealz-browser-qa
          path: |
            artifacts/
            test-results/
          if-no-files-found: warn

      - name: Stop stack and remove ephemeral volumes
        if: always()
        run: docker compose down -v
