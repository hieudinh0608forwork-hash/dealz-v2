name: WordPress integration tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wordpress-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, xml, zip
          tools: phpunit:9.6
      - name: Install WordPress test library
        run: |
          curl -fsSL https://raw.githubusercontent.com/WordPress/wordpress-develop/6.8/tests/phpunit/includes/install-wp-tests.sh -o /tmp/install-wp-tests.sh
          bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.8
      - name: Run DealZ integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: phpunit -c phpunit.xml.dist
