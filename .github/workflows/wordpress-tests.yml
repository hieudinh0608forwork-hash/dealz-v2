name: WordPress integration tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  wordpress-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring, curl, xml, zip
          tools: phpunit:9.6
      - name: Install WordPress test library
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/scaffold-command/main/templates/install-wp-tests.sh -o /tmp/install-wp-tests.sh
          WP_INSTALL_TESTS_SKIP_UPDATE_CHECK=true bash /tmp/install-wp-tests.sh wordpress_test root root 127.0.0.1 6.8
      - name: Run DealZ integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        working-directory: wp-content/plugins/dealz-core
        run: phpunit -c phpunit.xml.dist
