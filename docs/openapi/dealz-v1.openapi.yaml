openapi: 3.1.0
info:
  title: DealZ V2 API
  version: 0.2.0
  description: >
    Executable contract for the implemented WordPress health, traveler trip,
    manual itinerary, budget and expense endpoints. Marketplace, booking,
    payment, AI and provider-backed routing are not represented as live APIs.
servers:
  - url: /wp-json/dealz/v1
security:
  - wordpressCookie: []
    wordpressNonce: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Scaffold status, not production readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /trips:
    get:
      operationId: listTrips
      responses:
        '200':
          description: Trips owned by the authenticated user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Created trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    get:
      operationId: getTrip
      responses:
        '200':
          description: Owned trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTrip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveTrip
      responses:
        '200':
          description: Trip archived, not physically deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archived'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_public_id}/itineraries:
    parameters:
      - name: trip_public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listItineraries
      responses:
        '200':
          description: Itinerary versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Itinerary'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createItinerary
      responses:
        '201':
          description: New manual itinerary version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerary'
        '404':
          $ref: '#/components/responses/NotFound'
  /itineraries/{public_id}/days:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    get:
      operationId: listItineraryDays
      responses:
        '200':
          description: Days in an owned itinerary
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Day'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createItineraryDay
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCreate'
      responses:
        '201':
          description: Created day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Day'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /days/{public_id}/validation:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    get:
      operationId: validateItineraryDay
      description: Checks explicit user-entered local time overlaps only. Does not estimate route time or travel feasibility.
      responses:
        '200':
          description: Schedule validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayValidation'
        '404':
          $ref: '#/components/responses/NotFound'
  /days/{public_id}/items:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    get:
      operationId: listItineraryItems
      responses:
        '200':
          description: Active stop and meal cards
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryItem'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createItineraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemCreate'
      responses:
        '201':
          description: Created itinerary item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    patch:
      operationId: updateItineraryItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemUpdate'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveItineraryItem
      responses:
        '200':
          description: Item archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archived'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_public_id}/budget:
    parameters:
      - name: trip_public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTripBudget
      responses:
        '200':
          description: Active budget lines and totals grouped by cost type and currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetSummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_public_id}/budget/lines:
    parameters:
      - name: trip_public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createBudgetLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineCreate'
      responses:
        '201':
          description: Created budget line with server-calculated total
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /budget/lines/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    patch:
      operationId: updateBudgetLine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BudgetLineUpdate'
      responses:
        '200':
          description: Updated budget line
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetLine'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveBudgetLine
      responses:
        '200':
          description: Budget line archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archived'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_public_id}/expenses:
    parameters:
      - name: trip_public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTripExpenses
      responses:
        '200':
          description: Active actual expenses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
      responses:
        '201':
          description: Created expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /expenses/{public_id}:
    parameters:
      - $ref: '#/components/parameters/PublicId'
    patch:
      operationId: updateExpense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
      responses:
        '200':
          description: Updated expense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveExpense
      responses:
        '200':
          description: Expense archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Archived'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    wordpressCookie:
      type: apiKey
      in: cookie
      name: wordpress_logged_in_<site-hash>
      description: Actual cookie suffix is site-specific.
    wordpressNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress REST nonce for cookie-authenticated requests.
  parameters:
    PublicId:
      name: public_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Health:
      type: object
      required: [service, status, application_ready, message]
      properties:
        service: { const: dealz-core }
        status: { const: scaffolded }
        application_ready: { const: false }
        message: { type: string }
    Archived:
      type: object
      required: [public_id, status]
      properties:
        public_id: { type: string, format: uuid }
        status: { const: archived }
    Trip:
      type: object
      required: [public_id, title, origin_text, destination_name, destination_timezone, traveler_count, currency, status, created_at, updated_at]
      properties:
        public_id: { type: string, format: uuid }
        title: { type: string, maxLength: 190 }
        origin_text: { type: string }
        destination_name: { type: string, maxLength: 190 }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        destination_timezone: { type: string }
        traveler_count: { type: integer, minimum: 1, maximum: 50 }
        budget_amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        status: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TripCreate:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 190 }
        origin_text: { type: string, maxLength: 255 }
        destination_name: { type: string, maxLength: 190 }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        destination_timezone: { type: string, default: Asia/Ho_Chi_Minh }
        traveler_count: { type: integer, minimum: 1, maximum: 50, default: 1 }
        budget_amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: VND }
    TripUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 190 }
        origin_text: { type: string, maxLength: 255 }
        destination_name: { type: string, maxLength: 190 }
        start_date: { type: [string, 'null'], format: date }
        end_date: { type: [string, 'null'], format: date }
        destination_timezone: { type: string }
        traveler_count: { type: integer, minimum: 1, maximum: 50 }
        budget_amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
    Itinerary:
      type: object
      required: [public_id, version, source, status, created_at]
      properties:
        public_id: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        source: { const: manual }
        status: { type: string }
        created_at: { type: string, format: date-time }
    Day:
      type: object
      required: [public_id, local_date, position]
      properties:
        public_id: { type: string, format: uuid }
        local_date: { type: string, format: date }
        position: { type: integer }
        notes: { type: [string, 'null'] }
    DayCreate:
      type: object
      additionalProperties: false
      required: [local_date]
      properties:
        local_date: { type: string, format: date }
        position: { type: integer, minimum: 0, maximum: 999 }
    ItineraryItem:
      type: object
      required: [public_id, item_type, title_snapshot, position, currency, data_status, status]
      properties:
        public_id: { type: string, format: uuid }
        item_type: { type: string, enum: [stop, lunch, dinner] }
        title_snapshot: { type: string, maxLength: 190 }
        description: { type: [string, 'null'] }
        address_snapshot: { type: string }
        start_local: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        end_local: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer }
        transport_mode: { type: string }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        estimated_cost_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        data_status: { type: string }
        status: { type: string }
    ItineraryItemCreate:
      type: object
      additionalProperties: false
      required: [title_snapshot]
      properties:
        item_type: { type: string, enum: [stop, lunch, dinner], default: stop }
        title_snapshot: { type: string, minLength: 1, maxLength: 190 }
        description: { type: string, maxLength: 2000 }
        address_snapshot: { type: string, maxLength: 255 }
        start_local: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$' }
        end_local: { type: [string, 'null'], pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9])?$' }
        duration_minutes: { type: [integer, 'null'], minimum: 1, maximum: 1440 }
        position: { type: integer, minimum: 0, maximum: 999 }
        transport_mode: { type: string, maxLength: 24 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        estimated_cost_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: VND }
        data_status: { type: string, enum: [verified, unverified, suggested, estimated], default: unverified }
        place_provider: { type: string, maxLength: 32 }
        place_provider_id: { type: string, maxLength: 190 }
    ItineraryItemUpdate:
      allOf:
        - $ref: '#/components/schemas/ItineraryItemCreate'
      minProperties: 1
    DayValidation:
      type: object
      required: [is_valid, checked_items, issues, limitations]
      properties:
        is_valid: { type: boolean }
        checked_items: { type: integer, minimum: 0 }
        issues:
          type: array
          items: { $ref: '#/components/schemas/ScheduleIssue' }
        limitations:
          type: array
          items: { type: string }
    ScheduleIssue:
      type: object
      required: [code, item_public_id, message]
      properties:
        code: { type: string, enum: [invalid_start_time, invalid_end_time, invalid_time_range, time_overlap] }
        item_public_id: { type: string, format: uuid }
        conflict_public_id: { type: string, format: uuid }
        message: { type: string }
    BudgetLine:
      type: object
      required: [public_id, category, quantity, currency, cost_type, status]
      properties:
        public_id: { type: string, format: uuid }
        category: { type: string, maxLength: 40 }
        description: { type: string, maxLength: 255 }
        quantity: { type: string, pattern: '^[0-9]+\\.[0-9]{2}$' }
        unit_amount_minor: { type: [integer, 'null'], minimum: 0 }
        total_amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        cost_type: { type: string, enum: [estimate, quoted, confirmed, actual] }
        source_type: { type: string }
        source_id: { type: string }
        status: { type: string }
    BudgetLineCreate:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: { type: string, minLength: 1, maxLength: 40 }
        description: { type: string, maxLength: 255 }
        quantity: { type: string, pattern: '^[0-9]{1,8}(?:\\.[0-9]{1,2})?$', default: '1.00' }
        unit_amount_minor: { type: [integer, 'null'], minimum: 0 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: VND }
        cost_type: { type: string, enum: [estimate, quoted, confirmed, actual], default: estimate }
        source_type: { type: string, maxLength: 32 }
        source_id: { type: string, maxLength: 64 }
    BudgetLineUpdate:
      allOf:
        - $ref: '#/components/schemas/BudgetLineCreate'
      minProperties: 1
    BudgetSummary:
      type: object
      required: [lines, summary]
      properties:
        lines:
          type: array
          items: { $ref: '#/components/schemas/BudgetLine' }
        summary:
          type: array
          items:
            type: object
            required: [cost_type, currency, line_count, total_amount_minor]
            properties:
              cost_type: { type: string }
              currency: { type: string }
              line_count: { type: integer }
              total_amount_minor: { type: [integer, 'null'] }
    Expense:
      type: object
      required: [public_id, category, amount_minor, currency, occurred_at, note, split_method, created_at]
      properties:
        public_id: { type: string, format: uuid }
        category: { type: string, maxLength: 40 }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        occurred_at: { type: string, description: UTC datetime in MySQL format }
        note: { type: string }
        split_method: { type: string }
        created_at: { type: string, format: date-time }
    ExpenseCreate:
      type: object
      additionalProperties: false
      required: [category, amount_minor, occurred_at]
      properties:
        category: { type: string, minLength: 1, maxLength: 40 }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$', default: VND }
        occurred_at: { type: string, format: date-time, description: ISO-8601 timestamp with explicit timezone }
        note: { type: string, maxLength: 1000 }
    ExpenseUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        category: { type: string, minLength: 1, maxLength: 40 }
        amount_minor: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Za-z]{3}$' }
        occurred_at: { type: string, format: date-time }
        note: { type: string, maxLength: 1000 }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            status: { type: integer }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or not owned by current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
