openapi: 3.1.0
info:
  title: DealZ V2 API
  version: 0.1.0
  description: Initial executable contract for the scaffold health check and traveler-owned trip CRUD. This is not a contract for unimplemented marketplace, AI, routing or payment modules.
servers:
  - url: /wp-json/dealz/v1
security:
  - wordpressCookie: []
    wordpressNonce: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Check DealZ Core scaffold status
      responses:
        '200':
          description: Scaffold status (not application readiness)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /trips:
    get:
      operationId: listMyTrips
      summary: List trips owned by the authenticated traveler
      responses:
        '200':
          description: Trips belonging to current user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTrip
      summary: Create a private draft trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreate'
      responses:
        '201':
          description: Created trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getTrip
      summary: Get a trip owned by current user
      responses:
        '200':
          description: Trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateTrip
      summary: Update editable fields of an owned trip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdate'
      responses:
        '200':
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: archiveTrip
      summary: Archive an owned trip without deleting its data
      responses:
        '200':
          description: Archived trip
          content:
            application/json:
              schema:
                type: object
                required: [public_id, status]
                properties:
                  public_id:
                    type: string
                    format: uuid
                  status:
                    const: archived
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /trips/{trip_public_id}/itineraries:
    parameters:
      - name: trip_public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listTripItineraries
      summary: List manual itinerary versions for an owned trip
      responses:
        '200':
          description: Itinerary versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Itinerary'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createManualItinerary
      summary: Create a new manual itinerary version
      responses:
        '201':
          description: Created itinerary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Itinerary'
        '404':
          $ref: '#/components/responses/NotFound'
  /itineraries/{public_id}/days:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listItineraryDays
      summary: List days in an owned itinerary
      responses:
        '200':
          description: Itinerary days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Day'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addItineraryDay
      summary: Add a local calendar day within the trip date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DayCreate'
      responses:
        '201':
          description: Created day
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DayCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /days/{public_id}/items:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listItineraryItems
      summary: List active stops and meal cards for an owned day
      responses:
        '200':
          description: Day items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItineraryItem'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addItineraryItem
      summary: Add a main stop or small lunch/dinner card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemCreate'
      responses:
        '201':
          description: Created item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /items/{public_id}:
    parameters:
      - name: public_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateItineraryItem
      summary: Update an owned itinerary item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItineraryItemUpdate'
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItineraryItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveItineraryItem
      summary: Archive an item without physically deleting it
      responses:
        '200':
          description: Archived item
          content:
            application/json:
              schema:
                type: object
                required: [public_id, status]
                properties:
                  public_id:
                    type: string
                    format: uuid
                  status:
                    const: archived
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    wordpressCookie:
      type: apiKey
      in: cookie
      name: wordpress_logged_in_<site-hash>
      description: WordPress logged-in cookie; the actual cookie suffix is site-specific.
    wordpressNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress REST nonce required for cookie-authenticated writes.
  schemas:
    Health:
      type: object
      required: [service, status, application_ready, message]
      properties:
        service:
          const: dealz-core
        status:
          const: scaffolded
        application_ready:
          const: false
        message:
          type: string
    Trip:
      type: object
      required: [public_id, title, origin_text, destination_name, destination_timezone, traveler_count, currency, status, created_at, updated_at]
      properties:
        public_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 190
        origin_text:
          type: string
        destination_name:
          type: string
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        destination_timezone:
          type: string
          default: Asia/Ho_Chi_Minh
        traveler_count:
          type: integer
          minimum: 1
          maximum: 50
        budget_amount_minor:
          type: [integer, 'null']
          minimum: 0
          description: Integer minor units; VND is stored in đồng, not floating point.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TripCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 190
        origin_text:
          type: string
          maxLength: 255
        destination_name:
          type: string
          maxLength: 190
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        destination_timezone:
          type: string
          default: Asia/Ho_Chi_Minh
        traveler_count:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        budget_amount_minor:
          type: [integer, 'null']
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
          default: VND
    TripUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 190
        origin_text:
          type: string
          maxLength: 255
        destination_name:
          type: string
          maxLength: 190
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        destination_timezone:
          type: string
        traveler_count:
          type: integer
          minimum: 1
          maximum: 50
        budget_amount_minor:
          type: [integer, 'null']
          minimum: 0
        currency:
          type: string
          pattern: '^[A-Za-z]{3}$'
    Itinerary:
      type: object
      required: [public_id, version, source, status, created_at]
      properties:
        public_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        source:
          const: manual
        status:
          type: string
        created_at:
          type: string
          format: date-time
    Day:
      type: object
      required: [public_id, local_date, position]
      properties:
        public_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        position:
          type: integer
        notes:
          type: [string, 'null']
    DayCreate:
      type: object
      required: [local_date]
      additionalProperties: false
      properties:
        local_date:
          type: string
          format: date
        position:
          type: integer
          minimum: 0
          maximum: 999
    DayCreated:
      type: object
      required: [public_id, local_date, position]
      properties:
        public_id:
          type: string
          format: uuid
        local_date:
          type: string
          format: date
        position:
          type: [integer, 'null']
    ItineraryItem:
      type: object
      required: [public_id, item_type, title_snapshot, position, currency, data_status, status]
      properties:
        public_id:
          type: string
          format: uuid
        item_type:
          type: string
          enum: [stop, lunch, dinner]
        title_snapshot:
          type: string
          maxLength: 190
        description:
          type: [string, 'null']
        address_snapshot:
          type: string
        start_local:
          type: [string, 'null']
          pattern: '^(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            status:
              type: integer
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
